<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Redirect after 1.8 seconds -->
    <meta http-equiv="refresh" content="5; url=http://213.165.78.141/birthday/" />

    <!-- WhatsApp / Browser Title -->
    <title>💖 A Little Surprise For Anshu ✨</title>
    <meta name="description" content="A magical birthday surprise made especially for Anshu ❤️" />

    <meta property="og:title" content="🎂 Happy Birthday Anshu 💖">
    <meta property="og:description" content="Tap to begin your magical birthday journey ✨❤️">
    <meta property="og:type" content="website">

    <!-- Replace with your GitHub Pages URL -->
    <meta property="og:url" content="https://radhe-radhe-dua.github.io/for-anshu/">

    <!-- Replace with your preview image -->
    <meta property="og:image" content="https://radhe-radhe-dua.github.io/for-anshu/Birthday.jpg">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffd9ec, #e4c8ff, #bfefff);
            position: relative;
        }

        /* Animated dreamy background */
        body::before {
            content: "";
            position: absolute;
            inset: -30%;
            background:
                radial-gradient(circle, #ffffff88 2px, transparent 2px);
            background-size: 60px 60px;
            animation: stars 18s linear infinite;
            opacity: .45;
        }

        @keyframes stars {
            from {
                transform: translateY(0)
            }

            to {
                transform: translateY(-200px)
            }
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            color: #ff4f91;
            opacity: .45;
            animation: float 8s linear infinite;
            font-size: 20px;
        }

        .heart:nth-child(1) {
            left: 8%;
            animation-duration: 9s;
            font-size: 18px;
        }

        .heart:nth-child(2) {
            left: 30%;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 70%;
            animation-duration: 10s;
            animation-delay: 4s;
        }

        .heart:nth-child(4) {
            left: 90%;
            animation-duration: 13s;
            animation-delay: 1s;
        }

        @keyframes float {
            from {
                transform: translateY(110vh) scale(.5);
            }

            to {
                transform: translateY(-20vh) scale(1.2);
            }
        }

        /* Butterflies */
        .butterfly {
            position: absolute;
            font-size: 22px;
            animation: fly 10s linear infinite;
            opacity: .8;
        }

        .b1 {
            top: 18%;
            left: -30px;
        }

        .b2 {
            bottom: 22%;
            right: -30px;
            animation-delay: 3s;
        }

        @keyframes fly {
            from {
                transform: translateX(0) translateY(0) rotate(-10deg);
            }

            to {
                transform: translateX(120vw) translateY(-40px) rotate(20deg);
            }
        }

        /* Main Card */
        .card {
            position: relative;
            z-index: 10;
            width: min(90%, 380px);
            padding: 34px 26px;
            border-radius: 28px;
            background: rgba(255, 255, 255, .18);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .35);
            box-shadow: 0 15px 45px rgba(0, 0, 0, .15);
            text-align: center;
            color: white;
        }

        .gift {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .2);
            font-size: 42px;
            animation: pulse 2s infinite;
            box-shadow: 0 0 25px rgba(255, 255, 255, .45);
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 40px;
            margin-top: 18px;
            color: #7a1456;
            text-shadow: 0 2px 12px rgba(255, 255, 255, 0.8);
        }

        .name {
            font-size: 18px;
            font-weight: 600;
            color: #8b1e5d;
            margin-top: 6px;
            letter-spacing: .5px;
        }

        p {
            margin-top: 16px;
            font-size: 15px;
            line-height: 1.6;
            color: #5b2d55;
            font-weight: 500;
            opacity: .95;
        }

        /* Loading bar */
        .progress {
            margin-top: 28px;
            width: 100%;
            height: 6px;
            border-radius: 50px;
            background: rgba(255, 255, 255, .25);
            overflow: hidden;
        }

        .progress span {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: 50px;
            background: linear-gradient(90deg, #ffffff, #ffe0f2, #ffffff);
            animation: load 4.9s linear forwards;
            box-shadow: 0 0 15px rgba(255, 255, 255, .9);
        }

        @keyframes load {
            to {
                width: 100%;
            }
        }

        .footer {
            margin-top: 22px;
            font-size: 13px;
            opacity: .8;
            color: #7a1456;
            font-weight: 600;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
            animation: sparkle 2.2s infinite ease-in-out;
        }

        .s1 {
            top: 18%;
            left: 20%;
        }

        .s2 {
            top: 28%;
            right: 18%;
            animation-delay: .5s;
        }

        .s3 {
            bottom: 18%;
            left: 18%;
            animation-delay: 1.2s;
        }

        .s4 {
            bottom: 28%;
            right: 24%;
            animation-delay: 1.8s;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: .2;
                transform: scale(.6);
            }

            50% {
                opacity: 1;
                transform: scale(1.8);
            }
        }
    </style>
</head>

<body>

    <!-- Floating Hearts -->
    <div class="heart">💖</div>
    <div class="heart">💕</div>
    <div class="heart">💗</div>
    <div class="heart">💞</div>

    <!-- Butterflies -->
    <div class="butterfly b1">🦋</div>
    <div class="butterfly b2">🦋</div>

    <!-- Sparkles -->
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>

    <!-- Invitation Card -->
    <div class="card">

        <div class="gift">🎁</div>

        <h1>Hey Anshu...</h1>

        <div class="name">A Little Surprise Awaits You ✨</div>

        <p>
            Someone spent time making something special,
            filled with memories, smiles, and a little bit of magic...
        </p>

        <div class="progress">
            <span></span>
        </div>

        <div class="footer">
            Opening your birthday journey... 💖
        </div>

    </div>

</body>

</html>
